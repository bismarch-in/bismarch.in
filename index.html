<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BISMARCH | Futuristic Frontier</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Syncopate:wght@400;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050509; 
            --main-accent: #00f2fe; 
            --second-accent: #4facfe; 
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --card-bg: rgba(20, 20, 35, 0.6); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Exo 2', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            background-image: radial-gradient(#1a1a2e 1px, transparent 1px);
            background-size: 50px 50px;
        }

        nav {
            position: fixed; top: 0; width: 100%;
            background: rgba(5, 5, 9, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-family: 'Audiowide', cursive;
            font-size: 1.8rem; color: var(--main-accent);
            text-transform: uppercase; letter-spacing: 3px;
        }

        header.hero {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 0 10%;
        }

        header.hero h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: 3.5rem; letter-spacing: 5px; margin-bottom: 1rem;
        }

        header.hero h1 span {
            background: linear-gradient(90deg, var(--main-accent), var(--second-accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        section { padding: 5rem 10%; }

        .section-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 2rem; text-align: center; margin-bottom: 3rem; letter-spacing: 4px;
        }

        .project-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;
        }

        .project-card {
            background: var(--card-bg); border-radius: 12px; padding: 2rem;
            text-align: center; border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .project-card:hover { border-color: var(--main-accent); transform: translateY(-5px); }

        .cta-btn {
            padding: 12px 30px; border-radius: 5px; text-decoration: none;
            font-family: 'Audiowide', cursive; text-transform: uppercase;
            background: linear-gradient(45deg, var(--main-accent), var(--second-accent));
            color: #000; display: inline-block; transition: 0.3s;
        }

        @media (max-width: 768px) {
            header.hero h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">BISMARCH</div>
    </nav>

    <header class="hero">
        <h1>BISMARCH:<br><span>Futuristic Frontier</span></h1>
        <p style="color: #b0b0b0; margin-bottom: 30px;">Neutron Netam | Content & AI Visionary</p>
        <a href="#exclusive-rewards" class="cta-btn">View Rewards</a>
    </header>
